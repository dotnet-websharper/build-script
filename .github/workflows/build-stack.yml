name: 1. Build WebSharper Core Stack

on:
  workflow_dispatch:
    inputs:
      stackKind:
        description: 'Group (core/ui/templates/elmish/fluent/capacitor) or repo name, or "all"'
        required: false
        default: 'all'
      dotnetVersion:
        description: 'Select .NET SDK version'
        required: false
        default: '11.0.x'
      skipCoreTesting:
        description: 'Skip Core testing'
        type: boolean
        default: false
      branch:
        description: 'Branch to use for build process'
        required: false
        default: ''
      coreBranch:
        description: 'Branch to use for building core'
        required: false
        default: ''
      increasePatch:
        description: 'Increase patch version?'
        type: boolean
        default: false
      coreOnly:
        description: 'Core only?'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    env:
      WSPackageFolder: ../localnuget
      WSVersionsFile: ../versions.txt
      BUILD_NUMBER: ${{ github.run_number }}
      SKIP_CORE_TESTING: ${{ inputs.skipCoreTesting }}
      INCREASE_PATCH_VERSION: ${{ inputs.increasePatch }}

    steps:

    - name: Parameters
      shell: bash
      run: |
        {
          echo "# Parameters :wrench:"
          echo ""
          echo "Target: ${{ inputs.stackKind }}"
          echo "Dotnet version: ${{ inputs.dotnetVersion }}"
          echo "Skip core testing: ${{ inputs.skipCoreTesting }}"
          echo "Branch for stack: ${{ inputs.branch }}"
          echo "Branch for core: ${{ inputs.coreBranch }}"
          echo "Increase patch: ${{ inputs.increasePatch }}"
          echo "Core only: ${{ inputs.coreOnly }}"
        } >> $GITHUB_STEP_SUMMARY

    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          repos.yml
          package-helper.fsx
          notification-helper.fsx
        sparse-checkout-cone-mode: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-quality: preview
        dotnet-version: ${{ inputs.dotnetVersion }}

    # separate step: dotnet-quality applies to every version in a step
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Toolchain
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        # before adding the GitHub registry, so the tool is only looked up on nuget.org
        dotnet tool install paket --global --version 12.0.0-alpha001

        dotnet nuget add source https://nuget.pkg.github.com/dotnet-websharper/index.json `
          --name github `
          --username intellifactory-gh `
          --password ${{ secrets.PAT_PACKAGE }} `
          --store-password-in-clear-text

        npm i -g esbuild

        paket config add-credentials https://nuget.pkg.github.com/dotnet-websharper/index.json `
          --username intellifactory-gh `
          --password ${{ secrets.PAT_PACKAGE }}

        git config --global user.email "ci@intellifactory.com"
        git config --global user.name "IntelliFactory CI"

    - name: Prime Paket Git cache for build-script # workaround for https://github.com/fsprojects/Paket/issues/4461
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $cache = Join-Path $env:USERPROFILE '.paket\git\db\build-script'
        if (Test-Path -LiteralPath $cache) {
          Remove-Item -LiteralPath $cache -Recurse -Force
        }
        New-Item -ItemType Directory -Force -Path (Split-Path $cache) | Out-Null
        git clone --mirror https://github.com/dotnet-websharper/build-script $cache

    - name: Resolve targets
      id: resolve
      shell: pwsh
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
        Install-Module powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser

        $cfg        = (Get-Content ./repos.yml -Raw) | ConvertFrom-Yaml
        $sel        = ('${{ inputs.stackKind }}').Trim(); if (-not $sel) { $sel = 'all' }
        $coreOnly   = '${{ inputs.coreOnly }}'   -eq 'true'
        $coreBranch = '${{ inputs.coreBranch }}'
        $branch     = '${{ inputs.branch }}'

        function Norm($e) {
          if ($e -is [string]) { @{ name = $e; over = @{} } }
          else { $kv = $e.GetEnumerator() | Select-Object -First 1; @{ name = $kv.Key; over = $kv.Value } }
        }
        $all = @($cfg.all | ForEach-Object { Norm $_ })
        $order = @(); $overBy = @{}; $pos = @{}
        foreach ($a in $all) { $pos[$a.name] = $order.Count; $order += $a.name; $overBy[$a.name] = $a.over }

        function Resolve([string]$name) {
          $over = if ($overBy.ContainsKey($name)) { $overBy[$name] } else { @{} }
          $bkey = if ($over.Contains('build')) { $over['build'] } else { $cfg.defaults.build }
          [pscustomobject]@{
            name             = $name
            ref              = if ($name -eq 'core' -and $coreBranch) { $coreBranch } else { $branch }
            build            = $cfg.builds[$bkey]
            commit           = if ($over.Contains('commit')) { [bool]$over['commit'] } else { [bool]$cfg.defaults.commit }
            tag              = if ($over.Contains('tag'))    { [bool]$over['tag'] }    else { [bool]$cfg.defaults.tag }
            skipWhenCoreOnly = [bool]($over.Contains('skipWhenCoreOnly') -and $over['skipWhenCoreOnly'])
          }
        }

        $names = @()
        foreach ($p in ($sel -split '[,;]' | Where-Object { $_ })) {
          $p = $p.Trim()
          if ($p -eq 'all') {
            $names += $order
          } elseif ($cfg.groups.Contains($p)) {
            $unknown = @($cfg.groups[$p] | Where-Object { -not $pos.ContainsKey($_) })
            if ($unknown.Count -gt 0) { throw "Group '$p' references unknown repo(s): $($unknown -join ', ')" }
            $names += $cfg.groups[$p]
          } elseif ($pos.ContainsKey($p)) {
            $names += $p
          } else {
            throw "Unknown group or repo: '$p'. Use 'all', a group name, or a repo name from repos.yml."
          }
        }
        # Always build in dependency order, even for comma-separated selections.
        $names = @($names | Select-Object -Unique | Sort-Object { $pos[$_] })

        $targets = @($names | ForEach-Object { Resolve $_ })
        if ($coreOnly) { $targets = @($targets | Where-Object { -not $_.skipWhenCoreOnly }) }

        $targets | ConvertTo-Json -Depth 5 -AsArray | Set-Content ./targets.json
        "count=$($targets.Count)" | Out-File $env:GITHUB_OUTPUT -Append
        Write-Host "Targets: $($targets.name -join ', ')"

    - name: Check out targets
      if: steps.resolve.outputs.count != '0'
      shell: pwsh
      env:
        PAT: ${{ secrets.PAT_PACKAGE }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        foreach ($t in @(Get-Content ./targets.json -Raw | ConvertFrom-Json)) {
          # The token stays in the clone URL so CI-Commit/CI-Tag can push; the runner is throwaway.
          $ref = if ($t.ref) { @('--branch', $t.ref) } else { @() }
          git clone @ref "https://x-access-token:$env:PAT@github.com/dotnet-websharper/$($t.name).git" $t.name
        }

    - name: Build
      if: steps.resolve.outputs.count != '0'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        foreach ($t in @(Get-Content ./targets.json -Raw | ConvertFrom-Json)) {
          Write-Host "::group::Build $($t.name)"
          Push-Location $t.name
          Invoke-Expression $t.build
          Pop-Location
          Write-Host "::endgroup::"
        }

    - name: Packages
      shell: bash
      run: |
        {
          echo "# Packages :package:"
          echo ""
          echo "| Package | Version |"
          echo "|:---|:---|"
          dotnet fsi ./package-helper.fsx
        } >> $GITHUB_STEP_SUMMARY

    - name: Notification
      shell: bash
      env:
        DISCORD_PACKAGE_FEED: ${{ secrets.DISCORD_PACKAGE_FEED }}
      run: dotnet fsi ./notification-helper.fsx

    - name: Publish NuGet packages to GitHub registry
      shell: pwsh
      working-directory: ./localnuget
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet nuget push *.nupkg `
          --api-key ${{ secrets.PAT_PACKAGE }} `
          --source github `
          --skip-duplicate

    - name: Push packages as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: ./localnuget

    - name: Clean ./localnuget
      if: always()
      shell: pwsh
      run: Remove-Item -Recurse -Force ./localnuget -ErrorAction SilentlyContinue

    - name: Commit + tag versions
      if: steps.resolve.outputs.count != '0'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        foreach ($t in @(Get-Content ./targets.json -Raw | ConvertFrom-Json)) {
          if ($t.commit) {
            Write-Host "::group::Commit $($t.name)"
            Push-Location $t.name
            ./build CI-Commit
            Pop-Location
            Write-Host "::endgroup::"
          }
          if ($t.tag) {
            Write-Host "::group::Tag $($t.name)"
            Push-Location $t.name
            ./build CI-Tag
            Pop-Location
            Write-Host "::endgroup::"
          }
        }
