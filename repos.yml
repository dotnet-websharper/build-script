# Named build commands, referenced by `build:`.
builds:
  release: ./build CI-Release
  package: ./build WS-Package
  wsbuild: ./wsbuild

# Applied to every repo unless overridden below.
defaults:
  build: release
  commit: true
  tag: true

# The full ordered build list. `all` selects this, in this order.
# A plain name uses `defaults`; a nested block overrides them. The repo is
# dotnet-websharper/<name> and it is checked out into a folder named <name>.
all:
  - core
  - ui
  - mathjs
  - aspnetcore
  - templates:      { skipWhenCoreOnly: true }
  - jquery
  - forms
  - mvu
  - leaflet
  - d3
  - react
  - signalr
  - datefns
  - moment
  - plotly
  - chartjs
  - charting
  - highcharts
  - highlightjs
  - mathjax
  - elmish:          { build: wsbuild, commit: false, tag: false }
  - elmish.react
  #
  - ace
  - sweetalert
  - remarkable
  - jspdf
  - animejs
  # W3C browser-API bindings (select with the `w3c` group).
  - BackgroundFetch:             { build: package }
  - BatteryStatusAPI:            { build: package }
  - ClipboardAPI:                { build: package }
  - CompressionStreamsAPI:       { build: package }
  - CookieStore:                 { build: package }
  - CredentialManagement:        { build: package }
  - DragDropAPI:                 { build: package }
  - EncodingAPI:                 { build: package }
  - EncryptedMediaExtensionsAPI: { build: package }
  - FileSystemAPI:               { build: package }
  - GamepadAPI:                  { build: package }
  - Geolocation:                 { build: package }
  - HoudiniAPI:                  { build: package }
  - IntersectionObserverAPI:     { build: package }
  - MediaCapabilities:           { build: package }
  - MediaSession:                { build: package }
  - NetworkInformationAPI:       { build: package }
  - NotificationsAPI:            { build: package }
  - PaymentRequest:              { build: package }
  - PerformanceAPI
  - Permissions:                 { build: package }
  - PictureInPictureAPI:         { build: package }
  - PopoverAPI:                  { build: package }
  - PushAPI:                     { build: package }
  - ScreenWakeLockAPI:           { build: package }
  - ServiceWorker:               { build: package }
  - TaskSchedulingAPI:           { build: package }
  - TouchEvents:                 { build: package }
  - w3c-indexeddb
  - webrtc
  - webgpu:                      { build: package }
  - WebSerial:                   { build: package }
  - WebUSB:                      { build: package }
  - WebMIDI:                     { build: package }
  - WebLocks:                    { build: package }
  - WebAuthentication:           { build: package }
  - WebBluetooth:                { build: package }
  - WebCodecs:                   { build: package }
  - WebCrypto:                   { build: package }
  - WebSpeech:                   { build: package }
  - WebVTT:                      { build: package }
  #
  - fluentui-react-icons
  - fluentui-react-components
  - fable-browser
  - WebSharper.FsLexYacc.Runtime
  - WebSharper.Fable.Mocha:      { build: package }
  - WebSharper.Feliz:            { build: package, commit: false, tag: false }
  - Capacitor:                   { build: package }
  - capacitor.community:         { build: package }
  - Capacitor.CapGo:             { build: package }
  - CodeMirror:                  { build: package }
  - slickgrid:                   { build: package }
  - topojson:                    { build: package }

# Named collections. Selecting a group builds its members in `all` order.
# Any name that isn't here is treated as a repo and built with the defaults.
groups:
  core:      [core, ui, templates]
  ui:        [ui, templates]
  elmish:    [react, elmish, elmish.react]
  fluent:    [fluentui-react-icons, fluentui-react-components]
  capacitor: [Capacitor, capacitor.community, Capacitor.CapGo]
  w3c:
    - BackgroundFetch
    - BatteryStatusAPI
    - ClipboardAPI
    - CompressionStreamsAPI
    - CookieStore
    - CredentialManagement
    - DragDropAPI
    - EncodingAPI
    - EncryptedMediaExtensionsAPI
    - FileSystemAPI
    - GamepadAPI
    - Geolocation
    - HoudiniAPI
    - IntersectionObserverAPI
    - MediaCapabilities
    - MediaSession
    - NetworkInformationAPI
    - NotificationsAPI
    - PaymentRequest
    - PerformanceAPI
    - Permissions
    - PictureInPictureAPI
    - PopoverAPI
    - PushAPI
    - ScreenWakeLockAPI
    - ServiceWorker
    - TaskSchedulingAPI
    - TouchEvents
    - w3c-indexeddb
    - WebAuthentication
    - WebBluetooth
    - WebCodecs
    - WebCrypto
    - webgpu
    - WebMIDI
    - WebLocks
    - webrtc
    - WebSerial
    - WebSpeech
    - WebUSB
    - WebVTT
